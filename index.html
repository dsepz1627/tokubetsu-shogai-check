  <title>特別障害者手当 簡易判定システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type="radio"],input[type="checkbox"]{accent-color:#2563eb}
    .fade-in{animation:fi .2s ease-in}
    @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    input[type=number]::-webkit-inner-spin-button{opacity:1}
    select,input[type=text],input[type=number]{font-size:16px}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen py-8 px-4">
<div id="app" class="max-w-2xl mx-auto"></div>

      boneR1000: '',          // 骨導 右1000Hz

      boneL1000: '',          // 骨導 左1000Hz
      boneL2000: '',          // 骨導 左2000Hz

      onset: '',              // 初診年月

      iqTestName: '',         // 使用した知能検査名

        ef: '',               // 左室駆出率 EF（%）

      },

        viralLoad: '',        // 血漿中HIVウイルス量（copies/mL）
        artTherapy: '',       // 抗HIV療法（ART）: あり/なし

let state = initState();

// ═══════════════════════════════════════════════════════
// BODY DIAGRAM — インタラクティブ体イラスト（タッチ対応）
// ═══════════════════════════════════════════════════════
let selectedZone = null;

// 診断書イラストの記号種別（様式第11号に準拠）
const ZONE_COLORS = {
  '欠損':           {fill:'#1f2937',stroke:'#111827',text:'#f9fafb',btn:'bg-gray-800 border-gray-900 text-white'},
  '知覚脱失（部分）': {fill:'#fca5a5',stroke:'#ef4444',text:'#991b1b',btn:'bg-red-200 border-red-400 text-red-800'},
  '知覚鈍麻（部分）': {fill:'#fdba74',stroke:'#f97316',text:'#9a3412',btn:'bg-orange-200 border-orange-400 text-orange-800'},
  '知覚異常':       {fill:'#fde047',stroke:'#eab308',text:'#713f12',btn:'bg-yellow-200 border-yellow-400 text-yellow-800'},
  'その他障害':     {fill:'#c4b5fd',stroke:'#8b5cf6',text:'#3b0764',btn:'bg-violet-200 border-violet-400 text-violet-800'}
};

function zoneFill(part){
  const f=state.details.limb.partFunc[part];
  return ZONE_COLORS[f]?.fill||'#f3f4f6';
}
function zoneStroke(part){
  const f=state.details.limb.partFunc[part];
  return ZONE_COLORS[f]?.stroke||'#d1d5db';
}
function zoneTxtColor(part){
  const f=state.details.limb.partFunc[part];
  return ZONE_COLORS[f]?.text||'#9ca3af';
}

function tapZone(partKey){
  selectedZone=partKey;
  renderZonePanel();
  // ゾーン枠を強調
  document.querySelectorAll('.body-zone').forEach(el=>{
    el.style.filter=el.dataset.part===partKey?'drop-shadow(0 0 4px #3b82f6)':'none';
  });
}

function setZoneLevel(partKey,level){
  if(level===''){
    delete state.details.limb.partFunc[partKey];
    state.details.limb.parts=state.details.limb.parts.filter(p=>p!==partKey);
  } else {
    state.details.limb.partFunc[partKey]=level;
    if(!state.details.limb.parts.includes(partKey))state.details.limb.parts.push(partKey);
  }
  updateBodyDiagram();
  renderZonePanel();
}

function updateBodyDiagram(){
  Object.keys(LIMB_PARTS).forEach(part=>{
    document.querySelectorAll(`[data-part="${part}"]`).forEach(el=>{
      if(el.classList.contains('body-zone')){
        el.setAttribute('fill',zoneFill(part));
        el.setAttribute('stroke',zoneStroke(part));
      } else if(el.classList.contains('body-ext')){
        el.setAttribute('fill',zoneFill(part));
        el.setAttribute('stroke',zoneStroke(part));
      }
    });
    // ゾーンのテキストラベルの色更新
    const tEl=document.querySelector(`[data-part-txt="${part}"]`);
    if(tEl)tEl.setAttribute('fill',zoneTxtColor(part));
  });
  // 選択中ゾーンの選択状態を反映
  if(selectedZone)renderZonePanel();
}

// 各部位の切断高位選択肢（政令別表第2第3・4号判定用）
const AMP_LEVELS = {
  rightArm:['手根骨以下欠損','手関節離断','前腕1/2以下欠損','前腕1/2以上欠損','肘関節離断','上腕1/2以下欠損','上腕1/2以上欠損','肩関節離断'],
  leftArm: ['手根骨以下欠損','手関節離断','前腕1/2以下欠損','前腕1/2以上欠損','肘関節離断','上腕1/2以下欠損','上腕1/2以上欠損','肩関節離断'],
  rightHand:[], leftHand:[],
  rightLeg:['足根骨以下欠損','足関節離断','下腿1/2以下欠損','下腿1/2以上欠損','膝関節離断','大腿1/2以下欠損','大腿1/2以上','股関節離断','骨盤切断'],
  leftLeg: ['足根骨以下欠損','足関節離断','下腿1/2以下欠損','下腿1/2以上欠損','膝関節離断','大腿1/2以下欠損','大腿1/2以上','股関節離断','骨盤切断'],
  trunk:[]
};

function setAmpLevel(part, level) {
  const key = 'ampLevel' + part.charAt(0).toUpperCase() + part.slice(1);
  state.details.limb[key] = level;
}

function renderZonePanel(){
  const panel=document.getElementById('zone-panel');
  if(!panel)return;
  if(!selectedZone){
    panel.innerHTML=`<p class="text-xs text-gray-400 text-center py-3 select-none">↑ 体のイラストをタップして部位を選択してください</p>`;
    return;
  }
  const pName=LIMB_PARTS[selectedZone];
  const current=state.details.limb.partFunc[selectedZone];
  const ampKey='ampLevel'+selectedZone.charAt(0).toUpperCase()+selectedZone.slice(1);
  const ampLevel=state.details.limb[ampKey]||'';
  const ampOpts=AMP_LEVELS[selectedZone]||[];

  panel.innerHTML=`
    <p class="text-sm font-bold text-gray-700 mb-3 select-none">▶ ${pName}の機能状態を選択</p>
    <div class="grid grid-cols-2 gap-2 mb-2">
      ${Object.entries(ZONE_COLORS).map(([level,c])=>`
        <button ontouchend="event.preventDefault();setZoneLevel('${selectedZone}','${level}')"
          onclick="setZoneLevel('${selectedZone}','${level}')"
          class="py-3 px-2 rounded-xl border-2 text-sm font-bold transition select-none
            ${c.btn} ${current===level?'ring-2 ring-offset-1 ring-blue-500':'opacity-75'}">
          ${level}
        </button>`).join('')}
    </div>
    ${current==='欠損'&&ampOpts.length?`
    <div class="mt-3 p-3 bg-gray-50 rounded-xl border border-gray-200">
      <p class="text-xs font-bold text-gray-600 mb-1">切断高位（政令別表第2第3・4号の判定に使用）</p>
      <select onchange="setAmpLevel('${selectedZone}',this.value)"
        class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-1 focus:ring-orange-400 outline-none bg-white">
        <option value="">── 高位を選択 ──</option>
        ${ampOpts.map(l=>`<option value="${l}" ${ampLevel===l?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>`:''}
    <button ontouchend="event.preventDefault();setZoneLevel('${selectedZone}','')"
      onclick="setZoneLevel('${selectedZone}','')"
      class="w-full mt-2 py-2 text-xs text-gray-400 border border-gray-200 rounded-lg hover:bg-gray-50 select-none">
      この部位の選択を解除
    </button>`;
}

// ADL 17項目の○/△/× セット関数（onclick から呼び出し）
function setAdl(col, idx, mark) {
  if (col === 'no') state.details.limb.adlNoAid[idx] = mark;
  else              state.details.limb.adlWithAid[idx] = mark;
  // ボタンの色を更新（再レンダリングなし）
  ['no','with'].forEach(c => {
    ['○','△','×'].forEach(m => {
      const btn = document.getElementById(`adl_${c}_${idx}_${m}`);
      if (!btn) return;
      const cur = c==='no' ? state.details.limb.adlNoAid[idx] : state.details.limb.adlWithAid[idx];
      const active = cur === m;
      const colors = {
        '○':'bg-green-200 border-green-400 text-green-800',
        '△':'bg-yellow-200 border-yellow-400 text-yellow-800',
        '×':'bg-red-200 border-red-400 text-red-800'
      };
      btn.className = `text-sm font-bold py-1.5 px-3 rounded-lg border-2 transition min-w-[2.5rem]
        ${active ? colors[m] : 'border-gray-200 text-gray-400 bg-white'}`;
    });
  });
  // ADL合計を更新
  const filled = state.details.limb.adlNoAid.filter(v=>v!=='');
  if (filled.length > 0) {
    const total = state.details.limb.adlNoAid.reduce((s,v) => s+(v===''?0:v==='○'?0:v==='△'?1:2), 0);
    const el = document.getElementById('adl-total');
    if (el) {
      el.textContent = `合計 ${total} 点`;
      el.className = `font-bold text-sm ${total>=10?'text-orange-600':'text-gray-600'}`;
    }
    const bar = document.getElementById('adl-bar');
    if (bar) {
      const pct = Math.min(100, Math.round(total/34*100));
      bar.style.width = pct+'%';
      bar.className = `h-full rounded-full transition-all ${total>=10?'bg-orange-500':'bg-green-500'}`;
    }
  }
}

// LOGIC — 各障害の実効等級（1=最重度, 2=重度, 3=中等度以下）
// ═══════════════════════════════════════════════════════
function gradeLimb() {
  const d = state.details.limb;

  const parts = d.parts;
  const func  = d.partFunc;
  const isHeavy = f => f==='欠損'||f==='その他障害';
  const hasP    = p => parts.includes(p);
  const isH     = p => isHeavy(func[p]);

  // ── 2. 政令別表第2各号への該当判定
  // 第1号: 両上肢の機能を全廃したもの
  if (hasP('rightArm')&&hasP('leftArm')&&isH('rightArm')&&isH('leftArm'))
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:'両上肢の機能を全廃',
      basis:'政令別表第2第1号（両上肢の機能を全廃したもの）'};

  // 第2号: 両下肢の機能を全廃したもの
  if (hasP('rightLeg')&&hasP('leftLeg')&&isH('rightLeg')&&isH('leftLeg'))
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:'両下肢の機能を全廃',
      basis:'政令別表第2第2号（両下肢の機能を全廃したもの）'};

  // 第3号: 両上肢の全ての指を全廃したもの
  if (d.allFingersRightLost==='yes'&&d.allFingersLeftLost==='yes')
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:'両上肢の全指を全廃',
      basis:'政令別表第2第3号（両上肢の全ての指を全廃したもの）'};

  // 第4号: 両下肢を大腿1/2以上で欠くもの（切断高位から判定）
  const bigAmpLevels = ['大腿1/2以上','股関節離断','骨盤切断'];
  const bigAmpR = func['rightLeg']==='欠損'&&bigAmpLevels.includes(d.ampLevelRightLeg);
  const bigAmpL = func['leftLeg']==='欠損'&&bigAmpLevels.includes(d.ampLevelLeftLeg);
  if (bigAmpR&&bigAmpL)
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:`両大腿1/2以上欠損（右:${d.ampLevelRightLeg}・左:${d.ampLevelLeftLeg}）`,
      basis:'政令別表第2第4号（両下肢を大腿の2分の1以上で欠くもの）'};

  // 第5号: 体幹の機能に著しい障害を有するもの
  if (hasP('trunk')&&isH('trunk'))
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:'体幹の機能に著しい障害',
      basis:'政令別表第2第5号（体幹の機能に著しい障害を有するもの）'};

  // ── 3. 手帳等級1〜2（別表第2号の該当が明示できない場合の補完）
  const g = parseInt(d.grade)||0;
  if (g===1||g===2)
    return {grade:1, adlTotal:null, adlFilled:0,
      reason:`手帳${g}級（最重度相当、別表第2号の詳細確認を要する）`,
      basis:'政令別表第2各号（部位・機能の組合せにより該当号を確認してください）'};

  // ── 4. ADL評価（補助具なし） — 重複障害の第2号ルート候補として使用
  const adlFilled = d.adlNoAid.filter(v=>v!=='').length;
  const adlTotal  = adlFilled>0
    ? d.adlNoAid.reduce((s,v)=>s+(v===''?0:v==='○'?0:v==='△'?1:2),0)
    : null;

  if (adlTotal!==null&&adlTotal>=10)
    return {grade:2, adlTotal, adlFilled, adlOnly:true,
      reason:`ADL評価合計${adlTotal}点（≧10点）※重複障害ルートのみ有効`,
      basis:'政令第1条第2項第2号・手引き：政令別表第2第3〜5号の障害 + 日常生活活動評価表10点以上（重複障害の場合に適用）'};

  // ── 5. 手帳等級3〜4 → Grade 2（重複時の第2号候補）
  if (g===3||g===4)
    return {grade:2, adlTotal, adlFilled,
      reason:`手帳${g}級（重度相当・重複障害の第2号候補）`,
      basis:'政令別表第1各号の1〜2に該当（身体障害者手帳3〜4級相当）'};

  // ── 6. 手帳等級5〜6 → Grade 3
  if (g>=5)
    return {grade:3, adlTotal, adlFilled,
      reason:`手帳${g}級（中等度〜軽度）`,
      basis:'政令別表第1各号（身体障害者手帳5〜6級相当、単独では対象外）'};

  // データ不足
  if (adlTotal!==null)
    return {grade:3, adlTotal, adlFilled,
      reason:`ADL評価合計${adlTotal}点（10点未満）`,
      basis:'ADL評価10点未満：単独・重複いずれの基準にも未達'};

  return null;
}

function gradeVision() {
  const d = state.details.vision;
  if (d.lightPerception === 'なし（全盲）') return 1;
  const r = parseFloat(d.rightVision), l = parseFloat(d.leftVision);
  if (!isNaN(r) && !isNaN(l)) {
    const s = r+l;
    if (s <= 0.04) return 1;
    if (s <= 0.08) return 2;
    if (s <= 0.12) return 3;
    return 3;
  }
  // 視野角度で補完
  const rf = parseFloat(d.rightFieldDeg), lf = parseFloat(d.leftFieldDeg);
  if (!isNaN(rf) && !isNaN(lf)) {
    const avg = (rf+lf)/2;
    if (avg <= 10) return 1;
    if (avg <= 20) return 2;
    return 3;
  }
  return null;
}

function gradeHearing() {
  const d = state.details.hearing;
  // 4分法で計算できる場合
  const calc4 = (f500,f1000,f2000,f4000) => {
    const v = [parseFloat(f500),parseFloat(f1000)*2,parseFloat(f2000),parseFloat(f4000)];
    if (v.every(x=>!isNaN(x))) return (v[0]+v[1]+v[2]+v[3])/4;
    return NaN;
  };
  const r4 = calc4(d.right500,d.right1000,d.right2000,d.right4000);
  const l4 = calc4(d.left500,d.left1000,d.left2000,d.left4000);
  const rDb = !isNaN(r4)?r4:parseFloat(d.rightDb);
  const lDb = !isNaN(l4)?l4:parseFloat(d.leftDb);
  if (!isNaN(rDb) && !isNaN(lDb)) {
    const better = Math.max(rDb,lDb);
    if (better >= 100) return 1;
    if (better >= 90)  return 2;
    if (better >= 80)  return 3;
    return 3;
  }
  return null;
}

function gradeMental() {
  const d = state.details.mental;
  const grades = [];
  if (d.disType.includes('intellectual')) {
    const g = d.itGrade;
    if (g==='A重'||g==='A') grades.push(1);
    else if (g==='B中') grades.push(2);
    else if (g==='B軽') grades.push(3);
    const iq = parseFloat(d.iq);
    if (!isNaN(iq)) {
      if (iq<=35) grades.push(1);
      else if (iq<=50) grades.push(2);
      else grades.push(3);
    }
  }
  if (d.disType.includes('mental')) {
    if (d.pshGrade==='1') grades.push(1);
    else if (d.pshGrade==='2') grades.push(2);
    else if (d.pshGrade==='3') grades.push(3);
    if (d.mentalAdl.every(v=>v!=='')) {
      const s = d.mentalAdl.reduce((a,v)=>a+parseInt(v),0);
      if (s<=10) grades.push(1); else if (s<=17) grades.push(2); else grades.push(3);
    }
  }
  if (d.disType.includes('dementia')) {
    const cdr = parseFloat(d.cdr);
    if (!isNaN(cdr)) {
      if (cdr>=3) grades.push(1);
      else if (cdr>=2) grades.push(2);
      else grades.push(3);
    }
    const mmse = parseFloat(d.mmse);
    if (!isNaN(mmse)) {
      if (mmse<=10) grades.push(1);
      else if (mmse<=20) grades.push(2);
      else grades.push(3);
    }
  }
  return grades.length ? Math.min(...grades) : null;
}

function gradeInternalSub(type) {
  const d = state.details.internal[type];
  if (type==='heart') {
    if (d.nyha==='IV') return 1;
    if (d.nyha==='III') return 2;
    if (d.nyha==='II'||d.nyha==='I') return 3;
    const bnp=parseFloat(d.bnp);
    if (!isNaN(bnp)){if(bnp>=1000)return 1;if(bnp>=500)return 2;}
    return null;
  }
  if (type==='kidney') {
    if (d.dialysis==='血液透析'||d.dialysis==='腹膜透析') return 1;
    const e=parseFloat(d.egfr);
    if (!isNaN(e)){if(e<=10)return 1;if(e<=20)return 2;return 3;}
    return null;
  }
  if (type==='respiratory') {
    if (d.hfo==='あり') return 1;
    if (d.hmv==='あり') return 1;
    const vc=parseFloat(d.vcPercent);
    if (!isNaN(vc)){if(vc<=30)return 1;if(vc<=50)return 2;return 3;}
    const p=parseFloat(d.pao2);
    if (!isNaN(p)){if(p<=50)return 1;if(p<=60)return 2;return 3;}
    const sp=parseFloat(d.spo2);
    if (!isNaN(sp)){if(sp<=85)return 1;if(sp<=90)return 2;return 3;}
    return null;
  }
  if (type==='liver') {
    if (d.childPugh==='C') return 1;
    if (d.childPugh==='B') return 2;
    if (d.childPugh==='A') return 3;
    return null;
  }
  if (type==='bladder') {
    if (d.stomaType&&d.stomaType!=='なし') return 2;
    if (d.catheter==='あり') return 2;
    return 3;
  }
  if (type==='intestine') {
    if (d.tpn==='あり') return 1;
    if (d.tube==='あり') return 2;
    return 3;
  }
  if (type==='immune') {
    const cd4=parseFloat(d.cd4);
    if (!isNaN(cd4)){if(cd4<=50)return 1;if(cd4<=200)return 2;return 3;}
    return null;
  }
  return null;
}

function gradeInternal() {
  const subs = state.details.internal.subtypes;
  if (!subs.length) return null;
  const grades = subs.map(t=>gradeInternalSub(t)).filter(g=>g!==null);
  return grades.length ? Math.min(...grades) : null;
}

function getGrade(type) {
  const fn={limb:gradeLimb,vision:gradeVision,hearing:gradeHearing,
    mental:gradeMental,internal:gradeInternal}[type];
  if(!fn) return null;
  const r=fn();
  if(r===null) return null;
  // gradeLimb returns object; others return number
  return typeof r==='object' ? r : {grade:r, adlTotal:null, adlFilled:0, reason:''};
}

function combineTwo(g1,g2){
  const a=Math.min(g1,g2),b=Math.max(g1,g2);
  if(a===b) return Math.max(1,a-1);
  if(b-a===1) return a;
  return a;
}

function assess() {
  const sel = state.disabilities;
  const flow = []; // 認定基準体系表 思考フロー

  if (!sel.length) return {result:'ineligible',grades:{},gradeDetails:{},flow};

  const grades={}, gradeDetails={};
  sel.forEach(t=>{
    const r=getGrade(t);
    if(r!==null){grades[t]=r.grade; gradeDetails[t]=r;}
  });

  flow.push({
    step:'各障害の評価',
    items: Object.entries(gradeDetails).map(([k,d])=>({
      type: DIS_LABELS[k],
      grade: d.grade,
      label: d.grade===1?'最重度（1級相当）':d.grade===2?'重度（2級相当）':'中等度以下（3級相当）',
      reason: d.reason||'',
      basis: d.basis||''
    }))
  });

  const vals=Object.values(grades);
  if (!vals.length) {
    flow.push({step:'判定不能',text:'入力データ不足のため評価できません。ADL評価または手帳等級を入力してください。'});
    return {result:'ineligible',grades,gradeDetails,flow};
  }

  const thr = state.isAdult?1:2;
  const targetName = state.isAdult?'特別障害者手当（最重度=1級相当）':'障害児福祉手当（重度以上=2級相当）';

  flow.push({step:'判定対象の確認', text:`年齢${state.age}歳 → ${targetName}の判定`});

  // ADL-only フラグ確認（ADL単独はgrade:2だが重複障害専用）
  const isAdlOnly = k => gradeDetails[k]?.adlOnly === true;

  // 単一障害ルート
  if (vals.length===1) {
    flow.push({step:'認定基準体系表 ▶ 障害が単一の場合', text:''});
    const k=Object.keys(grades)[0];
    if(isAdlOnly(k)){
      flow.push({step:'→ 単独では基準未達（ADL評価は重複障害専用）',
        text:`ADL評価合計${gradeDetails[k].adlTotal}点（≧10点）は重複障害の場合のみ有効です。単独の肢体不自由では判定の対象外となります。\n根拠：政令第1条第2項第2号（重複障害に限定適用）`});
      return {result:'ineligible',grades,gradeDetails,flow};
    }
    const g=vals[0];
    if(g<=thr){
      flow.push({step:'→ 単独基準クリア',
        text:`${Object.values(gradeDetails)[0].grade}級相当（${g<=1?'最重度':'重度'}）が基準（${thr}級相当）を満たす\n根拠：政令第1条第2項第${thr===1?'1':'2'}号（単一障害）`});
      return {result:'eligible_single',grades,gradeDetails,flow,singleType:Object.keys(grades)[0]};
    }
    flow.push({step:'→ 単独では基準未達',
      text:`評価：${g}級相当 ／ 必要：${thr}級相当以上\n→ 不該当`});
    return {result:'ineligible',grades,gradeDetails,flow};
  }

  // 重複障害ルート
  flow.push({step:`認定基準体系表 ▶ 障害が重複している場合（${vals.length}種類）`, text:''});

  // まず単独クリア確認（adlOnly除く）
  const nonAdlEntries=Object.entries(grades).filter(([k])=>!isAdlOnly(k));
  const best=nonAdlEntries.length?Math.min(...nonAdlEntries.map(([,v])=>v)):99;
  if(best<=thr){
    const singleType=nonAdlEntries.find(([,v])=>v<=thr)?.[0];
    flow.push({step:'→ 重複中の単独基準クリア',
      text:`${DIS_LABELS[singleType]}が${best}級相当で単独クリア\n根拠：政令第1条第2項第${thr===1?'1':'2'}号（重複中単独）`});
    return {result:'eligible_single',grades,gradeDetails,flow,singleType};
  }

  // 別表1 併合認定（adlOnly を除外して計算）
  flow.push({step:'→ 単独未達。別表1「併合認定」を試みる',
    text:'手引き第3章第3節「二以上の障害がある場合の認定」別表1 適用'});
  const sorted=[...nonAdlEntries.map(([,v])=>v)].sort((a,b)=>a-b);
  let combined=sorted.length?sorted[0]:99;
  if(sorted.length){
    const combSteps=[`  開始：${sorted[0]}級相当`];
    for(let i=1;i<sorted.length;i++){
      const prev=combined;
      combined=combineTwo(combined,sorted[i]);
      combSteps.push(`  ${prev}級 ＋ ${sorted[i]}級 → 別表1適用 → ${combined}級相当`);
      if(combined<=thr) break;
    }
    flow.push({step:'別表1 計算過程', text:combSteps.join('\n')});
  } else {
    flow.push({step:'別表1 計算対象なし', text:'ADL評価のみで他の障害区分がないため、別表1併合認定の対象外です。'});
  }

  // ADL10点以上ルート（政令別表第2第3〜5号 + ADL≥10点 → 第2号）
  const limbD=gradeDetails.limb;
  if(limbD && limbD.adlTotal!==null && limbD.adlTotal>=10 && combined>thr && thr<=2){
    flow.push({step:'→ ADL評価ルート確認（認定基準体系表 第2号条件）',
      text:`肢体ADL合計${limbD.adlTotal}点（≧10点）\n政令別表第2第3〜5号の障害を有し日常生活活動評価表の点が10点以上 → 第2号該当`});
    combined=Math.min(combined,2);
    if(combined<=thr){
      flow.push({step:'→ ADL評価ルートで基準クリア', text:`ADL10点以上ルートにより${combined}級相当に到達`});
      return {result:'eligible_combined',grades,gradeDetails,flow};
    }
  }

  if(combined<=thr){
    flow.push({step:'→ 併合認定で基準クリア',
      text:`併合後${combined}級相当 → 基準（${thr}級相当）を満たす\n根拠：政令第1条第2項第${thr===1?'1':'2'}号（重複障害）`});
    return {result:'eligible_combined',grades,gradeDetails,flow};
  }

  flow.push({step:'→ 不該当',
    text:`併合後も${combined}級相当 → 基準（${thr}級相当）に未達\n→ 特別障害者手当・障害児福祉手当 ともに不該当`});
  return {result:'ineligible',grades,gradeDetails,flow};
}

// ─── 肢体不自由（身体障害者診断書・意見書 様式第11号 完全準拠）─────
function buildLimb(){
  const d=state.details.limb;

  // ADL合計計算
  const adlFilled=d.adlNoAid.filter(v=>v!=='').length;
  const adlTotal=adlFilled>0?d.adlNoAid.reduce((s,v)=>s+(v===''?0:v==='○'?0:v==='△'?1:2),0):null;

  // ADLボタン生成
  const adlBtn=(col,i,mark)=>{
    const cur=col==='no'?d.adlNoAid[i]:d.adlWithAid[i];
    const active=cur===mark;
    const colors={'○':'bg-green-200 border-green-400 text-green-800',
                  '△':'bg-yellow-200 border-yellow-400 text-yellow-800',
                  '×':'bg-red-200 border-red-400 text-red-800'};
    return `<button id="adl_${col}_${i}_${mark}"
      ontouchend="event.preventDefault();setAdl('${col}',${i},'${mark}')"
      onclick="setAdl('${col}',${i},'${mark}')"
      class="text-sm font-bold py-1.5 px-3 rounded-lg border-2 transition min-w-[2.5rem]
        ${active?colors[mark]:'border-gray-200 text-gray-400 bg-white'}">${mark}</button>`;
  };

  // ROM行生成（他動域・自動域 右/左）— 正しいパラメーター順: lbl, 右他動ID, 右他動値, 右自動ID, 右自動値, 左他動ID, 左他動値, 左自動ID, 左自動値, 正常値
  const romRow=(lbl,idR,vR,idRa,vRa,idL,vL,idLa,vLa,norm)=>`
    <tr class="border-b border-gray-100">
      <td class="py-1.5 px-1 text-xs text-gray-600 whitespace-nowrap">${lbl}</td>
      <td class="py-1 px-1 text-gray-400 text-center text-xs">${norm}</td>
      <td class="py-1 px-0.5"><input type="number" id="${idR}" value="${vR}" placeholder="${norm}" step="1"

function wrap_sub(title,html){
  return `<div class="bg-rose-50 rounded-xl p-4 mb-3"><p class="text-sm font-bold text-gray-700 mb-3">● ${title}</p>${html}</div>`;
}

function buildIntSub(type){
  const d=state.details.internal[type];
  const title=INTERNAL_SUBTYPES[type];
  if(type==='heart') return wrap_sub(title,`
    ${fld('傷病名',txt('h_disease',d.disease,'例：拡張型心筋症'))}
    ${fld('NYHA心機能分類',sel('h_nyha',d.nyha,[
      {v:'I',l:'I度：通常の活動で症状なし'},
      {v:'II',l:'II度：通常の活動でわずかに制限'},
      {v:'III',l:'III度：通常以下の活動で著明に制限'},
      {v:'IV',l:'IV度：安静時でも症状・ほぼ寝たきり'}
    ]))}
    ${fld('不整脈の合併',txt('h_arr',d.arrhythmia,'例：心房細動、完全房室ブロック等'))}
    ${grid2(
      fld('ペースメーカー/ICD植込み',sel('h_pm',d.pacemaker,['なし','あり'])),
      fld('BNP値',num('h_bnp',d.bnp,'500','pg/mL'))
    )}
    ${grid2(
      fld('左室駆出率（EF）',num('h_ef',d.ef,'30','%')),
      fld('6分間歩行距離（参考）',num('h_6mwt',d.sixMwt,'300','m'))
    )}`);

  if(type==='kidney') return wrap_sub(title,`
    ${fld('傷病名',txt('k_disease',d.disease,'例：慢性腎臓病、糖尿病性腎症'))}
    ${fld('透析療法',sel('k_dial',d.dialysis,['なし','血液透析','腹膜透析']))}
    ${d.dialysis&&d.dialysis!=='なし'?fld('透析回数',num('k_freq',d.dialysisFreq,'3','回/週')):''}
    ${grid2(
      fld('eGFR',num('k_egfr',d.egfr,'15','mL/min/1.73m²')),
      fld('血清クレアチニン',num('k_cr',d.creatinine,'3.0','mg/dL'))
    )}
    ${grid2(
      fld('血液尿素窒素（BUN）',num('k_bun',d.bun,'40','mg/dL')),
      fld('尿蛋白',sel('k_prot',d.proteinuria,['なし','±','+','++','+++']))
    )}
    ${fld('浮腫',sel('k_edema',d.edema,['なし','あり']))}`);

  if(type==='respiratory') return wrap_sub(title,`
    ${fld('傷病名',txt('r_disease',d.disease,'例：慢性閉塞性肺疾患（COPD）'))}
    ${grid2(
      fld('在宅酸素療法（HOT）',sel('r_hfo',d.hfo,['なし','あり'])),
      fld('在宅人工呼吸器',sel('r_hmv',d.hmv,['なし','あり']))
    )}
    ${d.hfo==='あり'?fld('HOT流量',num('r_flow',d.hfoFlow,'2','L/分')):''}
    ${grid2(
      fld('%肺活量（%VC）',num('r_vc',d.vcPercent,'30','%')),
      fld('一秒率（FEV1.0%）',num('r_fev',d.fev1,'50','%'))
    )}
    ${grid3(
      fld('PaO₂（mmHg）',num('r_pao2',d.pao2,'60','mmHg')),
      fld('PaCO₂（mmHg）',num('r_paco2',d.paco2,'45','mmHg')),
      fld('SpO₂（%）',num('r_spo2',d.spo2,'92','%'))
    )}`);

  if(type==='liver') return wrap_sub(title,`
    ${fld('傷病名',txt('l_disease',d.disease,'例：肝硬変（C型）'))}
    ${fld('Child-Pugh分類',sel('l_cp',d.childPugh,[{v:'A',l:'A（代償性・軽症）'},{v:'B',l:'B（中等度非代償性）'},{v:'C',l:'C（非代償性・重症）'}]))}
    ${grid2(
      fld('血清アルブミン',num('l_alb',d.albumin,'2.8','g/dL')),
      fld('PT-INR',num('l_ptr',d.ptInr,'1.8'))
    )}
    ${grid2(
      fld('総ビリルビン',num('l_tbil',d.tbil,'3.0','mg/dL')),
      fld('腹水',sel('l_asc',d.ascites,['なし','あり']))
    )}
    ${grid2(
      fld('肝性脳症',sel('l_enc',d.encephalopathy,['なし','あり'])),
      fld('黄疸',sel('l_jau',d.jaundice,['なし','あり']))
    )}`);

  if(type==='bladder') return wrap_sub(title,`
    ${fld('傷病名',txt('b_disease',d.disease,'例：膀胱癌術後、直腸癌術後'))}
    ${fld('ストーマの種別',sel('b_stoma',d.stomaType,['なし','人工肛門（永久）','膀胱ろう（永久）','人工肛門＋膀胱ろう両方']))}
    ${grid2(
      fld('カテーテル留置（常時）',sel('b_cath',d.catheter,['なし','あり'])),
      fld('失禁の状況',sel('b_inco',d.incontinence,['なし','尿失禁あり','便失禁あり','両方あり']))
    )}`);

  if(type==='intestine') return wrap_sub(title,`
    ${fld('傷病名',txt('i_disease',d.disease,'例：クローン病、短腸症候群'))}
    ${grid2(
      fld('中心静脈栄養（TPN）',sel('i_tpn',d.tpn,['なし','あり'])),
      fld('経管栄養（鼻腔・胃ろう）',sel('i_tube',d.tube,['なし','あり']))
    )}
    ${fld('小腸切除範囲（参考）',txt('i_res',d.resectionRange,'例：空腸・回腸の80%切除'))}`);

  if(type==='immune') return wrap_sub(title,`
    ${fld('傷病名',txt('im_disease',d.disease,'例：HIV感染症'))}
    ${grid2(
      fld('CD4陽性Tリンパ球数',num('im_cd4',d.cd4,'200','/μL')),
      fld('血漿中ウイルス量',num('im_vl',d.viralLoad,'500','copies/mL'))
    )}
    ${grid2(
      fld('抗HIV療法（ART）',sel('im_art',d.artTherapy,['なし','あり'])),
      fld('日和見感染症の合併',sel('im_oi',d.opportunistic,['なし','あり']))
    )}`);

  return '';
}

function buildProReview(res){
  const d=state.details.limb;
  const limbD=res.gradeDetails?.limb;
  const lines=[];
  if(res.result==='eligible_single'){
    lines.push('入力情報から、当該障害が単独で認定基準を満たす可能性があります。ただし、診断書の各記載内容が基準の要件を正確に充足しているか、主治医とご確認ください。');
  } else if(res.result==='eligible_combined'){
    lines.push('入力情報から、複数障害の組合せにより認定基準を満たす可能性があります。重複認定は各障害が独立して基準に記載されている必要があります。診断書の内容を精査してください。');
  } else {
    lines.push('現在の入力情報では認定基準に達していません。ただし、診断書の詳細な記載内容や追加の検査データにより結果が変わる可能性があります。');
    if(limbD&&limbD.adlTotal!==null&&limbD.adlTotal>=7){
      lines.push(`ADL評価合計${limbD.adlTotal}点（基準10点まであと${10-limbD.adlTotal}点）。境界線上のケースです。他の障害（視覚・聴覚・内臓疾患等）が合わせて認定されている場合、重複障害ルートで10点以上なら対象となる可能性があります。`);
    }
  }
  if(limbD&&limbD.adlOnly){
    lines.push('ADL10点以上は重複障害ルートのみ有効です。肢体不自由単独ではADL評価は判定に影響しません。他の障害区分が加わる場合に再評価をご検討ください。');
  }
  const missing=[];
  if(!d.disease)missing.push('傷病名・原因疾患');
  if(!d.grade)missing.push('身体障害者手帳等級');
  if(!d.parts||d.parts.length===0)missing.push('障害部位（体のイラスト）');
  if(missing.length)lines.push(`未入力の重要項目：${missing.join('・')}。これらが入力されるとより正確な判定が可能です。`);
  const allAdlEmpty=d.adlNoAid.every(v=>v==='');
  if(allAdlEmpty&&Object.keys(res.grades).length>0)
    lines.push('日常生活動作評価表（⑩17項目）が未入力です。重複障害ルートの検証にはADL評価が必要です。入力するとより精密な判定が行えます。');
  return lines;
}

function generateQaAnswer(q,res){
  const d=state.details.limb;
  const limbD=res.gradeDetails?.limb;
  const lower=q.toLowerCase();
  if(lower.includes('adl')&&(lower.includes('10点')||lower.includes('10点'))){
    return 'ADL評価が10点ちょうどの場合も「10点以上」の条件を満たします。ただし、重複障害がない場合（肢体不自由のみ）は対象外です。政令別表第2第3〜5号に該当する肢体障害に加えて、別の障害区分（視覚・聴覚・内臓等）が認定されている場合に限り有効です。';
  }
  if(lower.includes('重複')||lower.includes('複数')){
    return '重複障害とは、複数の異なる障害区分（例：肢体不自由＋視覚障害）を持つ場合です。この場合、別表1「併合認定」またはADL10点以上ルートにより判定が行われます。各障害が独立した診断書に基づいて認定されることが必要です。';
  }
  if(lower.includes('診断書')||lower.includes('記載')){
    return '診断書（様式第11号等）の記載内容が判定の根拠となります。記載が不十分な場合は認定が困難になるため、主治医に「特別障害者手当の申請用」であることを伝え、認定基準の各号に対応した詳細な記載を依頼することをお勧めします。';
  }
  if(lower.includes('不該当')||lower.includes('対象外')||lower.includes('通らない')){
    return '不該当の場合でも、次の点を確認してください。①他の障害区分（視覚・聴覚・内臓疾患）が認定されている場合は重複障害ルートを検討。②ADL評価が7点以上の場合は追加の医学的情報で10点超の可能性を再検討。③障害の程度が進行している場合は再申請も可能です。';
  }
  if(lower.includes('手帳')||lower.includes('等級')){
    return '身体障害者手帳の等級は直接の判定基準ではなく補助的な指標として使用しています。実際の特別障害者手当の判定は政令別表第2各号（両上肢全廃・両下肢全廃等）への直接該当で行われます。手帳1〜2級でも別表第2各号に該当しない場合がありますので、部位と機能の詳細入力が重要です。';
  }
  if(lower.includes('申請')||lower.includes('窓口')){
    return '申請窓口は市区町村の障害福祉課または福祉事務所です。必要書類は①申請書②医師の診断書（様式第11号）③身体障害者手帳④所得状況が分かる書類等です。認定は都道府県が行い、支給決定後に市区町村から通知されます。';
  }
  return `ご質問ありがとうございます。「${q.slice(0,20)}...」に関するご質問ですね。判定は厚生労働省「特別障害者手当及び障害児福祉手当の障害程度認定基準について」（昭和60年通知）に基づいています。個別の状況については、市区町村の障害福祉窓口または申請支援を行う社会福祉士・相談支援専門員にご相談されることをお勧めします。`;

function bSel(id,fn){const e=document.getElementById(id);if(e)e.addEventListener('change',ev=>fn(ev.target.value));}
function bNum(id,fn){const e=document.getElementById(id);if(e)e.addEventListener('input',ev=>fn(ev.target.value));}
function bTxt(id,fn){const e=document.getElementById(id);if(e)e.addEventListener('input',ev=>fn(ev.target.value));}

function updRadio(name,oc,ua){
  document.querySelectorAll(`input[name="${name}"]`).forEach(i=>{
    const l=i.closest('label');
    if(i.checked){oc.forEach(c=>l.classList.add(c));ua.forEach(c=>l.classList.remove(c));}
    else{oc.forEach(c=>l.classList.remove(c));ua.forEach(c=>l.classList.add(c));}
  });
}

  ib('h_pm','heart.pacemaker');ibn('h_bnp','heart.bnp');ibn('h_ef','heart.ef');ibn('h_6mwt','heart.sixMwt');
  // 腎臓
  ibt('k_disease','kidney.disease');ib('k_dial','kidney.dialysis');ibn('k_freq','kidney.dialysisFreq');
  ibn('k_egfr','kidney.egfr');ibn('k_cr','kidney.creatinine');ibn('k_bun','kidney.bun');
  ib('k_prot','kidney.proteinuria');ib('k_edema','kidney.edema');
  // 呼吸器
  ibt('r_disease','respiratory.disease');ib('r_hfo','respiratory.hfo');ib('r_hmv','respiratory.hmv');
  ibn('r_flow','respiratory.hfoFlow');ibn('r_vc','respiratory.vcPercent');ibn('r_fev','respiratory.fev1');
  ibn('r_pao2','respiratory.pao2');ibn('r_paco2','respiratory.paco2');ibn('r_spo2','respiratory.spo2');
  // 肝臓
  ibt('l_disease','liver.disease');ib('l_cp','liver.childPugh');ibn('l_alb','liver.albumin');
  ibn('l_ptr','liver.ptInr');ibn('l_tbil','liver.tbil');ib('l_asc','liver.ascites');
  ib('l_enc','liver.encephalopathy');ib('l_jau','liver.jaundice');
  // 膀胱
  ibt('b_disease','bladder.disease');ib('b_stoma','bladder.stomaType');
  ib('b_cath','bladder.catheter');ib('b_inco','bladder.incontinence');
  // 小腸
  ibt('i_disease','intestine.disease');ib('i_tpn','intestine.tpn');
  ib('i_tube','intestine.tube');ibt('i_res','intestine.resectionRange');
  // 免疫
  ibt('im_disease','immune.disease');ibn('im_cd4','immune.cd4');
  ibn('im_vl','immune.viralLoad');ib('im_art','immune.artTherapy');ib('im_oi','immune.opportunistic');

  const b4=document.getElementById('btn4');
  if(b4)b4.addEventListener('click',()=>{
    if(state.disabilities.includes('limb')&&!state.details.limb.grade){alert('肢体不自由の手帳等級を選択してください。');return;}
    if(state.disabilities.includes('mental')&&!state.details.mental.disType.length){alert('精神・知的障害の「障害種別」を選択してください。');return;}
    if(state.disabilities.includes('internal')&&!state.details.internal.subtypes.length){alert('内部障害の「種別」を選択してください。');return;}
    goStep(5);
  });

  const br=document.getElementById('btn_r');
  if(br)br.addEventListener('click',()=>{state=initState();renderApp();});
}

// ═══════════════════════════════════════════════════════
// NAVIGATION & BOOT
// ═══════════════════════════════════════════════════════
function goStep(n){state.step=n;renderApp();}
renderApp();
</script>
</body>
</html>
